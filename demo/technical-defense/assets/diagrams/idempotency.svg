<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#245D9B" stroke-width="1.4"/></marker></defs><rect width="1200" height="430" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><rect x="12" y="10" width="550" height="130" rx="7" fill="#F1F5FA" stroke="#BFCFDF" stroke-width="1.4"/><text x="32" y="49" font-size="32" fill="#11243B" font-weight="700">同一幂等键与相同参数</text><text x="32" y="84" font-size="23" fill="#42556B" font-weight="400">返回原 operation</text><text x="32" y="115.05" font-size="23" fill="#42556B" font-weight="400">避免重复建单 / 重复提交</text><rect x="638" y="10" width="550" height="130" rx="7" fill="#F1F5FA" stroke="#BFCFDF" stroke-width="1.4"/><text x="658" y="49" font-size="32" fill="#11243B" font-weight="700">同一幂等键与不同参数</text><text x="658" y="84" font-size="23" fill="#42556B" font-weight="400">拒绝冲突，不迁移旧授权</text><text x="658" y="115.05" font-size="23" fill="#42556B" font-weight="400">参数由服务端指纹约束</text><rect x="12" y="220" width="350" height="130" rx="7" fill="#F1F5FA" stroke="#BFCFDF" stroke-width="1.4"/><text x="32" y="259" font-size="32" fill="#11243B" font-weight="700">单个银行事务</text><text x="32" y="294" font-size="23" fill="#42556B" font-weight="400">BEGIN IMMEDIATE</text><text x="32" y="325.05" font-size="23" fill="#42556B" font-weight="400">余额、分录、回执、审计</text><rect x="425" y="220" width="350" height="130" rx="7" fill="#FFF5DC" stroke="#BFCFDF" stroke-width="1.4"/><text x="445" y="259" font-size="32" fill="#11243B" font-weight="700">提交后响应丢失</text><text x="445" y="294" font-size="23" fill="#42556B" font-weight="400">进入 unknown</text><text x="445" y="325.05" font-size="23" fill="#42556B" font-weight="400">禁止直接新建第二笔</text><rect x="838" y="220" width="350" height="130" rx="7" fill="#F1F5FA" stroke="#BFCFDF" stroke-width="1.4"/><text x="858" y="259" font-size="32" fill="#11243B" font-weight="700">按原 ID 核实</text><text x="858" y="294" font-size="23" fill="#42556B" font-weight="400">读取已提交回执</text><text x="858" y="325.05" font-size="23" fill="#42556B" font-weight="400">恢复后续步骤</text><path d="M362 285H417" fill="none" stroke="#245D9B" stroke-width="2.4" marker-end="url(#a)"/><path d="M775 285H830" fill="none" stroke="#245D9B" stroke-width="2.4" marker-end="url(#a)"/><text x="12" y="418" font-size="32" fill="#245D9B" font-weight="700">付款方 −a，收款方 +a，分录合计为 0</text></g></svg>