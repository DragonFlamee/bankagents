<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#245D9B" stroke-width="1.4"/></marker></defs><rect width="1200" height="430" fill="white"/><g font-family="Microsoft YaHei,sans-serif"><text x="12" y="52" font-size="37" fill="#11243B" font-weight="700">修正 z = 0.6745 × (金额 − 中位数) / MAD</text><rect x="12" y="100" width="550" height="205" rx="7" fill="#F1F5FA" stroke="#BFCFDF" stroke-width="1.4"/><text x="32" y="139" font-size="32" fill="#11243B" font-weight="700">统计线索</text><text x="32" y="174" font-size="23" fill="#42556B" font-weight="400">同类历史至少 5 笔</text><text x="32" y="205.05" font-size="23" fill="#42556B" font-weight="400">MAD = 0 时跳过该统计项</text><text x="32" y="236.1" font-size="23" fill="#42556B" font-weight="400">z &gt; 3.5 且满足金额条件才提示</text><rect x="638" y="100" width="550" height="205" rx="7" fill="#F1F5FA" stroke="#BFCFDF" stroke-width="1.4"/><text x="658" y="139" font-size="32" fill="#11243B" font-weight="700">业务规则线索</text><text x="658" y="174" font-size="23" fill="#42556B" font-weight="400">境外、凌晨、首次商户</text><text x="658" y="205.05" font-size="23" fill="#42556B" font-weight="400">同商户同金额 10 分钟内重复</text><text x="658" y="236.1" font-size="23" fill="#42556B" font-weight="400">逐条保留命中原因</text><text x="12" y="366" font-size="35" fill="#245D9B" font-weight="700">模拟案例：海外线上商户 ¥1,980.00</text><text x="12" y="418" font-size="29" fill="#11243B" font-weight="400">输出待核对交易和来源 ID，不自动认定欺诈</text></g></svg>