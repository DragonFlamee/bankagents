<g font-size="28" font-weight="700">
<text x="86" y="217" fill="#fff">React / TypeScript 工作台</text>
<text x="550" y="217">同源 API 与会话</text><text x="1020" y="217">独立确认与模拟 OTP</text>
<text x="84" y="422">候选规划器</text><text x="398" y="422">共享工具契约</text><text x="718" y="422">持久化编排</text><text x="1068" y="422">模拟银行服务</text>
<text x="86" y="668">受限数值分析</text><text x="550" y="668">计划、运行事件与回答</text><text x="1070" y="668">模拟业务账本</text>
</g>
<g font-size="21" fill="#425466">
<text x="86" y="254" fill="#B6C2D3">连续对话、过程、结果与回执</text>
<text x="550" y="254">身份归属、严格请求、CSRF</text><text x="1020" y="254">授权绑定操作，模型无认证工具</text>
<text x="84" y="460">模型或离线规则</text><text x="398" y="460">参数与 DAG 校验</text><text x="718" y="460">依赖、控制与原操作ID</text><text x="1068" y="460">风险、幂等、回执、审计</text>
<text x="86" y="706">DSL worker 与资源限制</text><text x="86" y="735">不运行任意 Python</text>
<text x="550" y="706">agent.sqlite3 / run_journal / answers</text><text x="550" y="735">只组织核验后的观测，不保存私密思考</text>
<text x="1070" y="706">bank.sqlite3</text><text x="1070" y="735">理财、锁定、预约、AA</text>
<text x="64" y="822">sessions.sqlite3 独立保存会话摘要；多库不是分布式原子事务；后台仅在演示进程运行时调度</text>
</g>
<text x="64" y="879" font-size="23" fill="#A13E32">已知 P1：预约到期未按实际当日累计升级强验证，修复与复测待完成</text>
<text x="64" y="926" font-size="20" fill="#60758B">共享契约 tools.py；分析与目录 insights.py / catalog.py；详细边界见 docs/architecture.md 与安全自评</text>
</g></svg>
