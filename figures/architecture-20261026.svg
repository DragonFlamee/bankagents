<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">TraceBank 当前系统架构</title>
<desc id="desc">React工作台经同源API使用规划器、共享工具契约、持久化编排与模拟银行服务。独立确认和验证由服务端处理。银行、计划和会话分别存储，后台预约存在实际日累计验证缺口。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#635BFF" stroke-width="1.3"/></marker></defs>
